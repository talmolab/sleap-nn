name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "sleap_nn/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      USE_CUDA: "0"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify uv.lock is current
        run: uv lock --check

      - name: Assert '--extra gpu' attaches cuDNN in uv.lock (regression guard for #632)
        # `--extra gpu` must keep a LIVE (single-extra) marker clause attaching
        # nvidia-cudnn-cu13 to the CUDA-13 torch wheel on linux/x86_64. A bare
        # substring of the extra name is NOT sufficient — it also appears inside
        # always-false conflict AND-pairs — so we match the full live disjunct on
        # the nvidia-cudnn-cu13 dependency line. See #632.
        #
        # We assert ONLY the linux/x86_64 clause on purpose: PyTorch's win_amd64
        # cu130 wheel bundles cuDNN inside the wheel and declares no separate
        # nvidia-cudnn-cu13 dependency, so a Windows clause can never exist here.
        # Do not "fix" this guard by adding one.
        run: |
          grep -F "(platform_machine == 'x86_64' and sys_platform == 'linux' and extra == 'extra-8-sleap-nn-gpu')" uv.lock \
            | grep -qF 'nvidia-cudnn-cu13' \
            || { echo "::error::uv.lock: '--extra gpu' no longer attaches nvidia-cudnn-cu13 on linux/x86_64 (regression of #632)"; exit 1; }

      - name: Install dev dependencies and torch
        run: uv sync --no-group gpu --extra torch-cpu

      - name: Run Black
        run: uv run --frozen --no-group gpu --extra torch-cpu black --check sleap_nn tests

      - name: Run Ruff
        run: uv run --frozen --no-group gpu --extra torch-cpu ruff check sleap_nn/

  tests:
    # Windows is the slowest job at ~11-13 min (slow VMs + torch-on-Windows);
    # ubuntu ~4 min, mac ~7 min. 20 gives comfortable headroom for load
    # variance while still catching genuine hangs. (The mac job used to blow
    # past 45 min because MPS compute intermittently hangs / OOMs on the
    # virtualized macos-14 runner; that is now neutralized by
    # SLEAP_NN_DISABLE_MPS below.)
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      USE_CUDA: "0"
      UV_FROZEN: "1"
      # Disable Apple Metal (MPS): the macos-14 runner reports MPS available
      # but real MPS compute intermittently hangs / raises "MPS backend out of
      # memory". Set here at the job level so both pytest and the `sleap-nn`
      # CLI subprocesses it spawns inherit it (honored in sleap_nn/__init__.py).
      # No-op on ubuntu/windows (no MPS).
      SLEAP_NN_DISABLE_MPS: "1"
    strategy:
      fail-fast: false
      matrix:
        # DIAGNOSTIC: windows only, at two heads -- the one that hung twice
        # (#756 rebased onto #755, 9f1ad78a) and its rebase onto D2 (3109a494).
        os: ["windows"]
        runs-on: ["windows-latest"]
        ref:
          - 9f1ad78a1626e052c522b6c8d1e1449dc90a33a9
          - 3109a49473d76dacbd1f8cff3af5118f816fda18
        python: [3.13]

    name: Tests (${{ matrix.os }}, ${{ matrix.ref }})
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python (non-self-hosted GPU)
        if: matrix.os != 'self-hosted-gpu'
        run: uv python install ${{ matrix.python }}

      - name: Install dev dependencies and torch (self-hosted GPU)
        if: matrix.os == 'self-hosted-gpu'
        run: uv sync --python 3.13 --no-group gpu --extra torch-cuda128

      - name: Install dev dependencies and torch (non-self-hosted GPU)
        if: matrix.os != 'self-hosted-gpu'
        run: uv sync --no-group gpu --extra torch-cpu

      - name: Install graphics dependencies (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update && sudo apt-get install -y libglapi-mesa libegl-mesa0 libegl1 libopengl0 libgl1 libglx-mesa0

      - name: Print environment info
        run: |
          echo "=== UV Environment ==="
          uv run --frozen --no-group gpu --extra torch-cpu python --version
          uv run --frozen --no-group gpu --extra torch-cpu python -c "import sys; print('Python executable:', sys.executable)"
          echo "=== UV Environment NumPy Check ==="
          uv run --frozen --no-group gpu --extra torch-cpu python -c "import numpy; print('NumPy version:', numpy.__version__); print('NumPy location:', numpy.__file__)" || echo "NumPy import failed in uv environment"
          echo "=== CUDA Availability Check ==="
          uv run --frozen --no-group gpu --extra torch-cpu python -c "
          import torch
          print(f'PyTorch version: {torch.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          print(f'CUDA device count: {torch.cuda.device_count()}')
          if torch.cuda.is_available():
              print(f'CUDA version: {torch.version.cuda}')
              print(f'Current device: {torch.cuda.current_device()}')
              print(f'Device name: {torch.cuda.get_device_name(0)}')
          else:
              print('CUDA is not available')
          " || echo "CUDA check failed"
          echo "=== Import Test ==="
          uv run --frozen --no-group gpu --extra torch-cpu python -c "import torch; import lightning; import skia; print('All imports successful')" || echo "Import test failed"

      - name: Check MPS backend (macOS only)
        if: runner.os == 'macOS'
        run: |
          echo "=== macOS MPS Backend Check ==="
          uv run --frozen --no-group gpu --extra torch-cpu python -c "
          import torch
          print(f'PyTorch version: {torch.__version__}')
          print(f'MPS available: {torch.backends.mps.is_available()}')
          print(f'MPS built: {torch.backends.mps.is_built()}')
          if torch.backends.mps.is_available():
              print('MPS backend is available and ready to use!')
              device = torch.device('mps')
              test_tensor = torch.randn(3, 3).to(device)
              print(f'Test tensor on MPS: {test_tensor.device}')
          else:
              print('MPS backend is not available on this macOS system')
          "

      # DIAGNOSTIC (emb-review F2 Windows hang), round 2: the EXACT CI pytest command
      # (coverage on), first thing on a fresh runner, with a faulthandler dump of every
      # thread's stack when one test runs past 240 s.
      - name: "DIAG F: exact CI pytest command + faulthandler"
        continue-on-error: true
        timeout-minutes: 32
        run: uv run --frozen --no-group gpu --extra torch-cpu pytest --cov=sleap_nn --cov-report=xml --durations=-1 -o faulthandler_timeout=240 tests/

      - name: Upload coverage
        if: github.repository == 'talmolab/sleap-nn'
        uses: codecov/codecov-action@v5
        with:
          # Coverage upload must NOT gate merges. The codecov-action verifies the
          # uploader binary against a GPG key fetched from a public keyserver, which
          # fails intermittently (codecov/codecov-action#1876: "Could not verify
          # signature") independently of codecov's backend; with fail_ci_if_error:true
          # those transient keyserver/upload hiccups turned every affected PR's CI red
          # despite all tests passing. Coverage still uploads when the keyserver is
          # reachable; it just no longer fails the job when it isn't.
          fail_ci_if_error: false
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The `backbones` extra (external pretrained HuggingFace encoders) is not part
  # of any other job's sync, so `tests/architectures/test_pretrained.py` — which
  # opens with `pytest.importorskip("transformers")` — has never executed in CI
  # on any platform. Three bugs of real size lived behind that (#740: encoder
  # mode on CNN backbones, the air-gapped load path, frozen BatchNorm), so the
  # feature shipped with zero automated coverage.
  #
  # Kept as its own job rather than a fourth matrix entry, for two reasons: the
  # extra only needs to be exercised on ONE platform (it is pure-Python
  # `transformers` over the same torch), and these tests reach huggingface.co —
  # so a Hub outage reddens this job alone instead of the whole test matrix.
  pretrained-backbones:
    name: Tests (pretrained backbones, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      USE_CUDA: "0"
      UV_FROZEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # The suite builds backbones with `weights=False`, so it fetches each
      # model's config.json (~400 KB total) and NO checkpoints. Cached below so
      # the usual run resolves offline.
      HF_HOME: ${{ github.workspace }}/.hf-cache
      # `weights=True` — the path the config-vs-kwargs divergence in #740 lived
      # in — is opt-in via SLEAP_NN_TEST_HF_WEIGHTS because it downloads real
      # checkpoints. Flip to "1" to extend this job to that path (the tests it
      # enables arrive with #740; the variable is inert before then).
      SLEAP_NN_TEST_HF_WEIGHTS: "0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Cache HuggingFace configs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          # Keyed on the test file: it names the models whose configs get
          # fetched, so the key changes exactly when that set can change.
          key: hf-configs-${{ hashFiles('tests/architectures/test_pretrained.py') }}
          restore-keys: hf-configs-

      - name: Install dev dependencies, torch and the backbones extra
        run: uv sync --no-group gpu --extra torch-cpu --extra backbones

      - name: Assert transformers is importable
        # Without this the suite would silently `importorskip` back to zero
        # coverage — the failure mode this job exists to close.
        run: |
          uv run --frozen --no-group gpu --extra torch-cpu --extra backbones python -c "
          import transformers
          print('transformers', transformers.__version__)
          "

      - name: Run pretrained backbone tests
        run: |
          uv run --frozen --no-group gpu --extra torch-cpu --extra backbones \
            pytest tests/architectures/test_pretrained.py -v --durations=10

  # Same gap as `pretrained-backbones`, for the `export` extra (onnx, onnxruntime,
  # onnxscript): no other job installs it, so every ONNX test -- `@requires_onnx` /
  # `@requires_onnxruntime` in tests/export and the `onnxruntime is None` module
  # skips under tests/inference -- was skipped in CI on every platform, including
  # the exported-embedding metadata and ONNX-vs-torch parity tests. One platform is
  # enough: the extra is prebuilt wheels over the same CPU torch. TensorRT tests
  # still skip here (they need a GPU).
  export-onnx:
    name: Tests (ONNX export, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      USE_CUDA: "0"
      UV_FROZEN: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dev dependencies, torch and the export extra
        run: uv sync --no-group gpu --extra torch-cpu --extra export

      - name: Install graphics dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libglapi-mesa libegl-mesa0 libegl1 libopengl0 libgl1 libglx-mesa0

      - name: Assert onnx and onnxruntime are importable
        # Without this the suite would silently skip back to zero ONNX coverage --
        # the failure mode this job exists to close.
        run: |
          uv run --frozen --no-group gpu --extra torch-cpu --extra export python -c "
          import onnx, onnxruntime
          print('onnx', onnx.__version__, 'onnxruntime', onnxruntime.__version__)
          "

      - name: Run ONNX export tests
        run: |
          uv run --frozen --no-group gpu --extra torch-cpu --extra export \
            pytest tests/export \
              tests/inference/layers/backends/test_onnx_backend.py \
              tests/inference/test_factory_export.py \
              tests/inference/ops/test_onnx_export.py \
              -v --durations=10

      - name: Assert the tests left no stray files in the checkout
        # tests/export/test_export_accuracy.py used to write
        # `tests/assets/datasets/centered_pair_small.predictions.slp` whenever onnx
        # was installed -- i.e. only ever on this job's configuration.
        run: |
          stray="$(git status --porcelain --untracked-files=all)"
          if [ -n "$stray" ]; then
            echo "::error::tests wrote files into the checkout:"
            echo "$stray"
            exit 1
          fi
